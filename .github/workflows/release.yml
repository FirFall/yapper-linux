name: Release

# Builds every Linux package format and attaches them to a GitHub Release,
# which is what install.sh and the README download from.
#
# Trigger a release by pushing a tag:  git tag v1.0.0 && git push origin v1.0.0
# Or run this workflow manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Native packages: .deb, .rpm, .pkg.tar.zst and the AppImage
  # ---------------------------------------------------------------------------
  packages:
    name: Native packages (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libopenjp2-tools \
            libarchive-tools \
            rpm \
            desktop-file-utils

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Generate icons from the source SVG
        run: npm run icons --if-present

      - name: Build packages
        run: npx electron-builder --linux AppImage deb rpm pacman tar.gz --x64

      - name: Checksums
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum *.AppImage *.deb *.rpm *.pkg.tar.zst *.tar.gz > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yapper-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Universal Flatpak bundle
  # ---------------------------------------------------------------------------
  flatpak:
    name: Flatpak bundle (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            flatpak flatpak-builder elfutils

      # flatpak-builder sandboxes the build with bubblewrap, which needs
      # unprivileged user namespaces. Newer Ubuntu restricts those by default.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Add the Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Generate icons
        run: npm run icons --if-present

      - name: Build the AppImage that the Flatpak wraps
        run: npx electron-builder --linux AppImage --x64

      - name: Build the Flatpak bundle
        env:
          SKIP_APPIMAGE: '1'
          # GitHub runners do not reliably expose /dev/fuse to the builder.
          DISABLE_ROFILES_FUSE: '1'
        run: ./scripts/build-flatpak.sh --arch x86_64

      - name: Upload the Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: yapper-linux-flatpak
          path: dist/*.flatpak
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Publish
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [packages, flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Yapper ${{ steps.version.outputs.value }}" \
              --generate-notes
          gh release upload "$TAG" artifacts/* --clobber
          echo "Published $TAG"
